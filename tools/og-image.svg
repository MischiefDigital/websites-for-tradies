<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0D0D0D"/>

  <!-- corner glow -->
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#F5C200" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F5C200" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- yellow rule -->
  <rect x="80" y="128" width="86" height="8" rx="4" fill="#F5C200"/>

  <!-- logo mark -->
  <g transform="translate(80, 56) scale(0.6)">
    <rect width="80" height="80" rx="18" fill="#1A1A1A"/>
    <path d="M49 15H29c-8 0-14 6-14 14v22c0 8 6 14 14 14h22c8 0 14-6 14-14V38" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 37v28" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="60" cy="22" r="10" fill="#F5C200"/>
  </g>
  <text x="140" y="94" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="-1">WFT</text>

  <!-- headline -->
  <text x="80" y="248" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="-3">WEBSITES FOR</text>
  <text x="80" y="336" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="900" fill="#F5C200" letter-spacing="-3">TRADIES NZ</text>

  <!-- subline -->
  <text x="80" y="404" font-family="Arial, sans-serif" font-size="31" font-weight="normal" fill="#B0B0B0">Live in 7 working days. Jobs in 90 — guaranteed.</text>

  <!-- fact chips -->
  <g>
    <rect x="80" y="466" width="368" height="70" rx="10" fill="#F5C200"/>
    <text x="264" y="512" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="#0D0D0D" text-anchor="middle">NZ$1,997 FLAT</text>

    <rect x="468" y="466" width="300" height="70" rx="10" fill="none" stroke="#2E2E2E" stroke-width="2"/>
    <text x="618" y="510" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">YOU OWN THE SITE</text>

    <rect x="788" y="466" width="232" height="70" rx="10" fill="none" stroke="#2E2E2E" stroke-width="2"/>
    <text x="904" y="510" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NO LOCK-IN</text>
  </g>

  <!-- domain -->
  <text x="1120" y="578" font-family="Arial, sans-serif" font-size="24" fill="#6E6E6E" text-anchor="end">websitesfortradies.co.nz</text>
</svg>
