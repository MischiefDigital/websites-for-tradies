<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#000000"/>

  <!-- corner glow -->
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#FDBE00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FDBE00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo slot: generate-images.js composites the reversed WFT monogram at
       (80,50), 60px tall. Keep this region clear. -->

  <!-- yellow rule -->
  <rect x="80" y="128" width="86" height="8" rx="4" fill="#FDBE00"/>

  <!-- headline -->
  <text x="80" y="248" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="-3">WEBSITES FOR</text>
  <text x="80" y="336" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="900" fill="#FDBE00" letter-spacing="-3">TRADIES NZ</text>

  <!-- subline -->
  <text x="80" y="404" font-family="Arial, sans-serif" font-size="31" font-weight="normal" fill="#B0B0B0">Live in 7 working days. Jobs in 90 — guaranteed.</text>

  <!-- fact chips -->
  <g>
    <rect x="80" y="466" width="368" height="70" rx="10" fill="#FDBE00"/>
    <text x="264" y="512" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="#000000" text-anchor="middle">NZ$1,997 FLAT</text>

    <rect x="468" y="466" width="300" height="70" rx="10" fill="none" stroke="#2E2E2E" stroke-width="2"/>
    <text x="618" y="510" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">YOU OWN THE SITE</text>

    <rect x="788" y="466" width="232" height="70" rx="10" fill="none" stroke="#2E2E2E" stroke-width="2"/>
    <text x="904" y="510" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NO LOCK-IN</text>
  </g>

  <!-- domain -->
  <text x="1120" y="578" font-family="Arial, sans-serif" font-size="24" fill="#6E6E6E" text-anchor="end">websitesfortradies.co.nz</text>
</svg>
